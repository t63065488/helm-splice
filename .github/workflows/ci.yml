name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test (Go matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.20, 1.21, 1.22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            $GOMODCACHE
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Install modules
        run: |
          go env
          go mod download

      - name: Check gofmt
        run: |
          set -e
          UNFMT=$(gofmt -l .)
          if [ -n "$UNFMT" ]; then
            echo "The following files need formatting (gofmt -w will fix):"
            echo "$UNFMT"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Build linux binary
        run: |
          set -e
          mkdir -p ./bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ./bin/helm-splice ./cmd/helm-splice

  release-check:
    name: Release check (optional)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build cross-platform binaries
        run: |
          mkdir -p ./artifacts
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              out=./artifacts/helm-splice-${os}-${arch}
              ext=""
              if [ "$os" = "windows" ]; then ext=".exe"; fi
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o ${out}${ext} ./cmd/helm-splice || true
            done
          done

      - name: List artifacts
        run: ls -la artifacts || true
